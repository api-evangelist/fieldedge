name: FieldEdge
kind: company
description: FieldEdge is field service management (FSM) software for HVAC, plumbing,
  electrical, and other home- and commercial-services contractors, owned by Xplor
  Technologies (branded "FieldEdge by Xplor"). It provides customer management,
  dispatching and scheduling, work orders, a technician mobile app, flat-rate
  pricebook, service agreements, invoicing and payments, and QuickBooks accounting
  sync. FieldEdge operates a partner-gated API delivered through an Azure API
  Management developer portal (docs.api.fieldedge.com); API products and keys are
  restricted to approved integration partners rather than being openly
  self-serve. The logical APIs listed here are honestly modeled from FieldEdge's
  documented product modules and its partner/integration surface - endpoint paths
  are modeled, not copied from a published public reference, because the reference
  and OpenAPI live behind the partner portal sign-in.
