  - url: https://www.linkedin.com/company/fieldedge
    type: LinkedIn
    note: FieldEdge by Xplor company page.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and FieldEdge's own public API is a
    partner-gated request/response REST surface behind an Azure API Management
    developer portal. No AsyncAPI document was created because there is no
    documented server-push transport on FieldEdge's own API to model, and the
    reference is not publicly accessible.
